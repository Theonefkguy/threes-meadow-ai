<!doctype html><html lang="en"><meta charset="utf-8"><title>V26 browser check</title><body><h1>V26 browser check</h1><p>Serve the repository root over HTTP and open /training/v26-late-cutoff/browser/. Run only after native continuations finish.</p><button id="run">Run browser test</button><pre id="status">Ready</pre><pre id="result"></pre><script type="module">
const button=document.querySelector('#run'),status=document.querySelector('#status'),result=document.querySelector('#result');
button.onclick=()=>{button.disabled=true;status.textContent='Loading model and running timing checks…';const worker=new Worker('./bench-worker.js',{type:'module'});worker.onmessage=({data})=>{if(data.type==='result'){status.textContent='Complete';result.textContent=JSON.stringify(data);window.v26Result=data;worker.terminate();}else{status.textContent=data.message;if(data.type==='error')worker.terminate();}};worker.onerror=e=>{status.textContent=String(e.message);worker.terminate();};worker.postMessage({});};
</script></body></html>
