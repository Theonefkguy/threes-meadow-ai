<!doctype html><html lang="en"><meta charset="utf-8"><title>V25 browser evaluation</title><body><h1>V25 browser evaluation</h1><p>Fixed and adaptive cutoff, V23 model. Run only after native evaluation finishes.</p><button id="run">Run browser test</button><pre id="status">Ready</pre><pre id="result"></pre><script type="module">
const button=document.querySelector('#run'),status=document.querySelector('#status'),result=document.querySelector('#result');
button.onclick=()=>{button.disabled=true;status.textContent='Loading model and running timing checks…';const worker=new Worker('./bench-worker.js',{type:'module'});worker.onmessage=({data})=>{if(data.type==='result'){status.textContent='Complete';result.textContent=JSON.stringify(data);worker.terminate();}else{status.textContent=data.message;if(data.type==='error')worker.terminate();}};worker.onerror=e=>{status.textContent=String(e.message);worker.terminate();};worker.postMessage({});};
</script></body></html>
