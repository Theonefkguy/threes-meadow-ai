<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Residual Timing</title>
<style>body{font:15px/1.5 system-ui,sans-serif;margin:16px;background:#fff;color:#111}pre{white-space:pre-wrap;word-break:break-all;font-size:12px}</style>
<h1>Web release timing</h1>
<p>Serve the repository root over HTTP and open <code>/training/web-release/browser/?base=...&amp;res=...</code> (paths relative to this page).</p>
<button id="run">Run timing</button> <span id="status"></span>
<pre id="result"></pre>
<script>
const q=new URLSearchParams(location.search),base=q.get('base')||'../../../dist/models/ntuple-v23.bin',res=(q.get('res')||'').split(',').filter(Boolean);
const status=document.getElementById('status'),result=document.getElementById('result');
document.getElementById('run').onclick=e=>{e.target.disabled=true;status.textContent='Loading model and running timing checks…';
 const w=new Worker('./bench-worker.js',{type:'module'});
 w.onmessage=({data})=>{if(data.type==='result'){status.textContent='Complete';window.benchResult=data;result.textContent=JSON.stringify({loadMs:data.loadMs,summary:data.summary},null,1);w.terminate();}
  else{status.textContent=data.message;if(data.type==='error')w.terminate();}};
 w.onerror=e=>{status.textContent=String(e.message);w.terminate();};
 w.postMessage({base,res});};
</script></html>
